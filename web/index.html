<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Deriv Safety Platform</title><style>body{font:16px system-ui;background:#0b1220;color:#e6edf7;margin:0}main{max-width:960px;margin:auto;padding:32px}.card{background:#152238;border:1px solid #2b405e;border-radius:12px;padding:20px;margin:16px 0}button,input{border-radius:8px;padding:12px;margin:4px}button{background:#d33;color:white;border:0;font-weight:700}pre{white-space:pre-wrap;color:#a9c7ef}.safe{color:#62d49c}</style></head><body><main><h1>Trading Safety Platform</h1><p class="safe">Demo-only dashboard. Live trading is unavailable from this service.</p><section class="card"><h2>Runtime</h2><pre id="status">Loading...</pre><input id="token" type="password" autocomplete="off" placeholder="Temporary operator token"><button id="stop">Emergency stop</button><p>Stop requires a 32+ character operator token with server-side expiry. Token is not stored.</p></section><section class="card"><h2>Strategy qualification gates</h2><pre id="gates">Loading...</pre></section></main><script>async function load(){status.textContent=JSON.stringify(await(await fetch('/api/v1/status')).json(),null,2);gates.textContent=JSON.stringify(await(await fetch('/api/v1/qualifications')).json(),null,2)}stop.onclick=async()=>{if(!confirm('Engage persistent emergency stop?'))return;const t=token.value;const r=await fetch('/api/v1/emergency-stop',{method:'POST',headers:{Authorization:'Bearer '+t,'X-CSRF-Token':t,'X-Deriv-Role':'operator'}});alert(await r.text());token.value='';load()};load()</script></body></html>
