[package]
name = "deriv_bot"
version = "1.0.0"
edition = "2021"
description = "Deriv Accumulate Auto-Trading Bot"
publish = false
autobins = false
default-run = "deriv_bot"

[[bin]]
name = "deriv_bot"
path = "src/main.rs"

[[bin]]
name = "deriv_watchdog"
path = "src/bin/watchdog.rs"

[[bin]]
name = "deriv_platform"
path = "src/bin/platform.rs"

[[bin]]
name = "generate_synthetic_fixture"
path = "src/bin/generate_synthetic_fixture.rs"

[[bin]]
name = "deriv_supervisor"
path = "src/bin/supervisor.rs"

[[bin]]
name = "deriv_ops"
path = "src/bin/ops.rs"

[[bin]]
name = "deriv_history"
path = "src/bin/history_audit.rs"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1

[features]
default = []
live-trading = []

[dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
futures-util = { version = "0.3", features = ["sink"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
log = "0.4"
env_logger = "0.11"
anyhow = "1"
csv = "1"
parking_lot = "0.12"
reqwest = { version = "0.12", features = ["json"] }
dotenvy = "0.15"
