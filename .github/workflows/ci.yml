name: ci

on:
  pull_request:
  push:

jobs:
  rust-and-deriv-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt -- --check
      - run: cargo test --locked
      - run: cargo install cargo-audit --locked
      - run: cargo audit
