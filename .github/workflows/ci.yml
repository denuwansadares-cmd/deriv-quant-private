name: ci

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:

jobs:
  rust-and-deriv-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo check --locked --workspace --all-targets
      - run: cargo build --locked --workspace --all-targets
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace --all-targets
      - run: cargo check --locked --workspace --all-targets --features live-trading
      - run: cargo build --locked --workspace --all-targets --features live-trading
      - run: cargo clippy --locked --workspace --all-targets --features live-trading -- -D warnings
      - run: cargo test --locked --workspace --all-targets --features live-trading
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --locked --workspace --no-deps
      - run: sha256sum -c fixtures/synthetic/R_100.csv.sha256
      - run: DERIV_AUDIT_JOURNAL_DIR=target/ci-audit DERIV_RANDOM_SEED=20260803 SIM_EXPECT_REPLAY_HASH=44effca3edc5f553 cargo run --locked --no-default-features --bin deriv_bot -- --mode simulation --symbols R_100 --history fixtures/synthetic
      - run: cargo test --locked --bin deriv_ops delivery_allowlist_excludes_untracked_and_unlisted_files
      - run: cargo test --locked --bin deriv_ops package_copy_rejects_destination_symlink_escape
      - run: cargo install cargo-deny --version 0.18.6 --locked
      - run: cargo deny check advisories bans licenses sources
      - run: cargo install cargo-about --version 0.9.0 --locked --features cli
      - run: cargo vendor --locked target/vendor-cache > /dev/null
      - run: cargo about generate --locked --offline --all-features about.hbs > target/cargo-about.html
      - run: cargo run --locked --bin deriv_ops -- generate-notices
      - run: git diff --exit-code -- THIRD_PARTY_NOTICES.md
      - run: cargo install cargo-llvm-cov --version 0.9.0 --locked
      - run: cargo llvm-cov --locked --workspace --all-targets --json --output-path target/coverage-default.json
      - run: cargo llvm-cov --locked --workspace --all-targets --features live-trading --json --output-path target/coverage-live.json
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo audit --deny warnings
      - run: cargo install cargo-cyclonedx --version 0.5.9 --locked
      - run: cargo cyclonedx --target all --format json --override-filename ci-sbom --quiet
      - run: jq -e ".components | length == 217" ci-sbom.json
      - run: |
          cargo metadata --locked --format-version 1 | jq -r '.packages[] | select(.source != null and (.source | startswith("registry+"))) | [.name,.version] | @tsv' | sort -u > target/metadata.tsv
          cut -f1,2 THIRD_PARTY_LICENSES.tsv | sort -u > target/inventory.tsv
          jq -r '.components[] | select(.type == "library") | [.name,.version] | @tsv' ci-sbom.json | sort -u > target/sbom.tsv
          wc -l target/metadata.tsv | grep -q '^217 '
          cmp target/metadata.tsv target/inventory.tsv
          cmp target/inventory.tsv target/sbom.tsv
          rg -c '^## `[^`]+` `[0-9]' THIRD_PARTY_NOTICES.md | grep -qx 217
      - run: |
          cp .env.example .env
          cp .env.example .dashboard.env
          printf "DASHBOARD_ADMIN_HASH=%s\nDASHBOARD_BUYER_HASH=%s\nDASHBOARD_OPERATOR_TOKEN=%s\nDASHBOARD_OPERATOR_CSRF=%s\nDERIV_PUBLIC_HOST=localhost\n" "ci" "ci" "ci-dashboard-token-0000000000000001" "ci-csrf-token-00000000000000000001" > .dashboard.env
      - run: cargo run --locked --bin deriv_ops -- release-readiness

  container-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - run: cp .env.example .env
      - run: |
          cp .env.example .dashboard.env
          sed -i "s/^DERIV_DASHBOARD_TOKEN=.*/DERIV_DASHBOARD_TOKEN=ci-dashboard-token-0000000000000001/" .env
          sed -i "s/^DERIV_DASHBOARD_CSRF_TOKEN=.*/DERIV_DASHBOARD_CSRF_TOKEN=ci-csrf-token-00000000000000000001/" .env
          sed -i "s/^DERIV_DASHBOARD_TOKEN_EXPIRES_UNIX=.*/DERIV_DASHBOARD_TOKEN_EXPIRES_UNIX=4102444800/" .env
          printf "DASHBOARD_ADMIN_HASH=%s\nDASHBOARD_BUYER_HASH=%s\nDASHBOARD_OPERATOR_TOKEN=%s\nDASHBOARD_OPERATOR_CSRF=%s\nDERIV_PUBLIC_HOST=localhost\n" "ci" "ci" "ci-dashboard-token-0000000000000001" "ci-csrf-token-00000000000000000001" > .dashboard.env
      - run: docker compose config --quiet
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: deriv-platform:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: |
          docker run --rm --entrypoint deriv_ops deriv-platform:ci 2>&1 | grep -q "usage: deriv_ops"
      - run: |
          docker run -d --name deriv-dashboard-ci -p 127.0.0.1:18080:8080 --entrypoint deriv_platform -e DERIV_DASHBOARD_BIND=0.0.0.0:8080 deriv-platform:ci
          curl --fail --silent --retry 5 --retry-connrefused --retry-delay 1 http://127.0.0.1:18080/api/v1/status
          docker stop deriv-dashboard-ci
          docker rm deriv-dashboard-ci
